name: Test and deploy Lambdas

on:
  push:
    branches: [Krithikha-24BIT0545]
    paths:
      - "aws-infra/**"
      - ".github/workflows/deploy-lambdas.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax check
        run: python -m py_compile aws-infra/lambdas/*/lambda_function.py
      - name: Rule tests
        run: python -m unittest discover -s aws-infra/tests -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show OIDC identity
        run: |
          URL="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com"
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$URL" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 -c "import sys,base64,json;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print({k:d.get(k) for k in ('sub','aud','repository','ref')})" "$TOKEN"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::996241421261:role/GitHubActionsLambdaDeploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy functions
        run: |
          deploy() {
            (cd "aws-infra/lambdas/$1" && zip -q "$GITHUB_WORKSPACE/$1.zip" lambda_function.py)
            aws lambda update-function-code --function-name "$2" --zip-file "fileb://$1.zip"
            aws lambda wait function-updated --function-name "$2"
          }
          deploy access_request ZeroTrustAccessRequest
          deploy recommendation ZeroTrustRecommendation
          deploy post_confirmation ZeroTrustPostConfirmation
